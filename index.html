<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Cadastro de Contatos</h1>
    </header>
    <form id="formContato">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome" required />
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone" required pattern="\d{4,5}-?\d{4}" title="Telefone no formato 9999-9999 ou 99999-9999" />
        <button type="submit">Cadastrar</button>
    </form>
    <table id="tabelaContatos" >
        <thead>
            <tr>
                <th>Nome Completo</th>
                <th>Seu numero de Telefone</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script src="main.js">
    </script>
</body>
</html>
